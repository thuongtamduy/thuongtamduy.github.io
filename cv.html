<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CV · Trần Tiến Đạt</title>
    <meta name="description" content="CV của Trần Tiến Đạt, Backend Engineer: thương mại điện tử đa nền tảng, SaaS multi-tenant, hạ tầng chịu tải và DevOps.">
    <link rel="icon" type="image/jpeg" href="avatar.jpg">
    <meta property="og:type" content="profile">
    <meta property="og:url" content="https://thuongtamduy.com/cv.html">
    <meta property="og:title" content="CV · Trần Tiến Đạt, Backend Engineer">
    <meta property="og:description" content="Thương mại điện tử đa nền tảng, SaaS multi-tenant, hạ tầng chịu tải và DevOps.">
    <meta property="og:image" content="https://thuongtamduy.com/avatar.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css">
    <link rel="alternate" hreflang="vi" href="https://thuongtamduy.com/cv.html">
    <link rel="alternate" hreflang="en" href="https://thuongtamduy.com/cv.html?lang=en">

    <style>
        .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 40px; }
        .toolbar {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center;
            margin-bottom: 16px;
        }
        .toolbar p { margin: 0; color: var(--muted); font-size: 14px; }
        .toolbar .actions { display: flex; gap: 8px; }

        .paper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* Header */
        .cv-head {
            display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center;
            padding: 32px 36px 28px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%);
        }
        .cv-head img {
            width: 104px; height: 104px; border-radius: 4px; object-fit: cover;
            box-shadow: 0 0 0 4px var(--surface), 0 0 0 5px var(--border);
        }
        .cv-head h1 { margin: 0; font-size: 30px; font-weight: 700; }
        .role { margin: 4px 0 14px; font-size: 16px; color: var(--accent); font-weight: 600; }
        .role .mono { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
        .contacts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
        .contacts a { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; color: var(--muted); }
        .contacts a:hover { color: var(--text); }

        /* Body grid */
        .cv-body { display: grid; grid-template-columns: 1fr 280px; }
        .cv-main { padding: 28px 36px 32px; }
        .cv-wide { padding: 28px 36px 32px; border-top: 1px solid var(--border); break-before: auto; }
        .cv-side { padding: 28px 28px 32px; border-left: 1px solid var(--border); background: color-mix(in srgb, var(--surface-2) 45%, transparent); }

        section + section { margin-top: 30px; }
        h2 {
            display: flex; align-items: center; gap: 10px;
            margin: 0 0 14px;
            font-size: 13px; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--muted);
        }
        h2::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .summary { margin: 0; font-size: 15.5px; }

        /* Timeline */
        .timeline { list-style: none; margin: 0; padding: 0; }
        .exp {
            position: relative;
            display: grid; grid-template-columns: 112px 1fr; gap: 16px;
            padding-bottom: 20px;
            break-inside: avoid;
        }
        .exp:last-child { padding-bottom: 0; }
        .exp::before {
            content: ''; position: absolute; left: 120px; top: 8px; bottom: -2px;
            width: 1px; background: var(--border);
        }
        .exp:last-child::before { display: none; }
        .exp-when { font-family: var(--mono); font-size: 13px; color: var(--muted); padding-top: 1px; white-space: nowrap; }
        .exp-what { position: relative; padding-left: 14px; }
        .exp-what::before {
            content: ''; position: absolute; left: -16px; top: 7px;
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--surface); border: 2px solid var(--accent);
        }
        .exp:first-child .exp-what::before { background: var(--accent); }
        .exp h3 { margin: 0; font-size: 16px; }
        .exp-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 3px; font-size: 13px; color: var(--muted); }
        .exp-meta a { color: var(--accent); text-decoration: none; }
        .exp-role { margin-top: 4px; font-weight: 600; font-size: 14px; }
        .exp ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }

        /* Capabilities */
        .caps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .cap {
            padding: 14px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface-2);
            break-inside: avoid;
        }
        .cap-head { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14.5px; }
        .cap-head svg { color: var(--accent); }
        .cap p { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); }

        /* Projects */
        .works { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .work { padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--border); break-inside: avoid; }
        .work-head strong { font-size: 15px; }
        .work-head a { text-decoration: none; }
        .work-head a:hover strong { color: var(--accent); }
        .work-head span { display: block; font-size: 12.5px; color: var(--muted); }
        .work-role { margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--accent); }
        .work p { margin: 6px 0 8px; font-size: 13.5px; }
        .work .tech { font-family: var(--mono); font-size: 11.5px; color: var(--accent); }
        .more { margin: 12px 0 0; font-size: 13.5px; }
        .more span { color: var(--muted); }
        .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .product {
            display: block;
            padding: 12px 14px;
            border-radius: var(--radius);
            border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
            background: color-mix(in srgb, var(--accent) 7%, transparent);
            text-decoration: none;
            break-inside: avoid;
        }
        .product strong { font-size: 15px; }
        .product p { margin: 3px 0 0; font-size: 13.5px; color: var(--muted); }
        .product .badge { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }

        /* Sidebar education / languages */
        .side-item + .side-item { margin-top: 10px; }
        .side-item b { display: block; font-size: 14px; font-weight: 600; }
        .side-item span { display: block; font-size: 13px; color: var(--muted); }
        .side-item .mono { font-size: 12px; }

        /* Sidebar skills */
        .skill-group + .skill-group { margin-top: 12px; }
        .skill-group h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
        .chips { display: flex; flex-wrap: wrap; gap: 5px; }
        .cv-side .chip { font-size: 12px; padding: 2px 8px; background: var(--surface); }

        @media screen and (max-width: 760px) {
            .cv-head { grid-template-columns: 1fr; text-align: center; padding: 28px 20px 24px; justify-items: center; }
            .contacts { justify-content: center; }
            .cv-body { grid-template-columns: 1fr; }
            .cv-main, .cv-wide { padding: 24px 20px; }
            .cv-side { border-left: 0; border-top: 1px solid var(--border); padding: 24px 20px; }
            .caps, .products, .works { grid-template-columns: 1fr; }
            .exp { grid-template-columns: 1fr; gap: 4px; padding-left: 18px; }
            .exp::before { left: 4px; top: 10px; }
            .exp-what { padding-left: 0; }
            .exp-what::before { left: -18px; top: -17px; }
            .exp-when { padding-left: 0; }
        }

        /* Print / Save as PDF: always light, A4 */
        @page { size: A4; margin: 10mm 0; }
        @page :first { margin-top: 0; }
        @media print {
            :root {
                --bg: #fff; --surface: #fff; --surface-2: #f3f5f8;
                --border: #e3e7ee; --text: #0f172a; --muted: #4b5565;
                --accent: #0369a1; --accent-ink: #fff; --shadow: none;
            }
            html { color-scheme: light; }
            body { background: #fff; font-size: 13px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .nav, .toolbar, .site-foot, .no-print { display: none !important; }
            .wrap { max-width: none; padding: 0; }
            .paper { border: 0; border-radius: 0; box-shadow: none; }
            .cv-head { padding: 12mm 14mm 8mm; }
            .cv-main { padding: 7mm 10mm 10mm 14mm; }
            .cv-side { padding: 7mm 14mm 10mm 8mm; }
            .reveal { animation: none; }
            a { text-decoration: none; }
            section + section { margin-top: 14px; }
            h2 { margin-bottom: 10px; }
            .cv-head img { width: 84px; height: 84px; border-radius: 18px; }
            .cv-head h1 { font-size: 26px; }
            .summary { font-size: 13.5px; }
            .exp { padding-bottom: 8px; break-inside: auto; }
            .exp li { break-inside: avoid; }
            .side-item b { font-size: 12px; }
            .side-item span { font-size: 11px; }
            .side-item + .side-item { margin-top: 6px; }
            .exp ul { font-size: 12.5px; margin-top: 4px; }
            .exp li + li { margin-top: 2px; }
            .cap { padding: 10px 12px; }
            .cap p { font-size: 12px; }
            .works { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .more { margin-top: 6px; }
            .side-item span { line-height: 1.35; }
            .work { padding: 8px 10px; }
            .work p { font-size: 11px; line-height: 1.4; margin: 3px 0 4px; }
            h2 { break-after: avoid; }
            .products { display: block; break-inside: avoid; }
            .product { display: block; padding: 0; border: 0; background: none; font-size: 11.5px; }
            .product + .product { margin-top: 3px; }
            .product strong { font-size: 12px; }
            .product .badge { display: inline; margin: 0 6px; }
            .product p { display: inline; margin: 0; font-size: 11.5px; }
            .cv-wide section + section { margin-top: 6px; }
            .work-head strong { font-size: 13px; }
            .work-head span, .work .tech { font-size: 10.5px; }
            .more { font-size: 11.5px; }
            .cv-head { padding: 9mm 14mm 5mm; }
            .cv-main { padding-top: 5mm !important; padding-bottom: 5mm !important; }
            .cv-side { padding-top: 5mm !important; }
            .cv-wide { padding: 4mm 14mm 2mm; }
            .cap-head { font-size: 13px; }
            .cv-body { grid-template-columns: 1fr 250px; }
            .skill-group + .skill-group { margin-top: 6px; }
            .skill-group h3 { margin-bottom: 1px; font-size: 11.5px; }
            .chips { gap: 4px; }
            .cv-side .chips { display: block; line-height: 1.4; }
            .cv-side .chip { display: inline; padding: 0; border: 0; background: none; font-size: 11.5px; font-weight: 400; white-space: normal; }
            .cv-side .chip:not(:last-child)::after { content: ', '; }
        }
    </style>
</head>
<body>
    <a class="skip" href="#cv" data-i18n="skip">Bỏ qua tới nội dung</a>
    <header class="nav">
        <div class="nav-inner">
            <a class="brand" href="./"><img src="avatar.jpg" alt=""><span>Trần Tiến Đạt</span></a>
            <nav class="nav-links" aria-label="Trang" data-i18n-aria="nav.aria">
                <a href="./" data-i18n="nav.card">Danh thiếp</a>
                <a href="cv.html" aria-current="page" data-keep-lang>CV</a>
                <a href="portfolio.html" data-keep-lang>Portfolio</a>
            </nav>
        </div>
    </header>

    <main class="wrap">
        <div class="toolbar reveal">
            <p data-i18n="cv.toolbar">Bản CV mới nhất, luôn cập nhật tại thuongtamduy.com/cv.html</p>
            <div class="actions">
                <a class="btn ghost" href="portfolio.html" data-keep-lang data-i18n="cv.viewPortfolio">Xem portfolio</a>
                <button class="btn" type="button" onclick="window.print()" id="print"></button>
            </div>
        </div>
        <article class="paper reveal" style="--i:1" id="cv" tabindex="-1" aria-busy="true"></article>
    </main>

    <footer class="site-foot" id="foot"></footer>

    <script src="assets/site.js"></script>
    <script>
        setupPage('cv');
        $('print').innerHTML = icon('printer', 17) + t('cv.print');

        loadResume().then(r => {
            const exp = r.experience.map(e => `
                <li class="exp">
                    <div class="exp-when">${esc(e.from)} – ${esc(e.to)}</div>
                    <div class="exp-what">
                        <h3>${esc(e.company)}</h3>
                        <div class="exp-meta">
                            ${e.group ? `<span>${esc(e.group)}</span>` : ''}
                            <span class="mono">${t('taxId')} ${esc(e.taxId)}</span>
                            ${e.url ? `<a href="${esc(e.url)}"${ext(e.url)}>${esc(e.url.replace(/^https?:\/\//, ''))}</a>` : ''}
                        </div>
                        ${e.role ? `<div class="exp-role">${esc(e.role)}</div>` : ''}
                        ${e.highlights?.length ? `<ul>${e.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}
                    </div>
                </li>`).join('');

            $('cv').innerHTML = `
                <header class="cv-head">
                    <img src="${esc(r.avatar)}" alt="${esc(r.name)}" width="104" height="104">
                    <div>
                        <h1>${esc(r.name)}</h1>
                        <p class="role">${esc(r.title)}<span class="mono">${t('years', years(r.since))}</span></p>
                        <ul class="contacts">
                            ${r.contact.map(c => `<li><a href="${esc(c.url)}"${ext(c.url)}>${icon(c.icon, 15)}${esc(c.value)}</a></li>`).join('')}
                        </ul>
                    </div>
                </header>

                <div class="cv-body">
                    <div class="cv-main">
                        <section>
                            <h2>${t('cv.about')}</h2>
                            <p class="summary">${esc(r.summary)}</p>
                        </section>

                        <section>
                            <h2>${t('cv.experience')}</h2>
                            <ol class="timeline">${exp}</ol>
                        </section>

                        <section class="no-print">
                            <h2>${t('cv.capabilities')}</h2>
                            <div class="caps">
                                ${r.capabilities.map(c => `
                                    <div class="cap">
                                        <div class="cap-head">${icon(c.icon, 18)}${esc(c.title)}</div>
                                        <p>${esc(c.text)}</p>
                                    </div>`).join('')}
                            </div>
                        </section>

                    </div>

                    <aside class="cv-side">
                        <section>
                            <h2>${t('cv.skills')}</h2>
                            ${r.skills.map(s => `
                                <div class="skill-group">
                                    <h3>${esc(s.group)}</h3>
                                    <div class="chips">${s.items.map(i => `<span class="chip">${esc(i)}</span>`).join('')}</div>
                                </div>`).join('')}
                        </section>

                        ${r.education?.length ? `
                        <section>
                            <h2>${t('cv.education')}</h2>
                            ${r.education.map(e => `
                                <div class="side-item">
                                    <b>${esc(e.school)}</b>
                                    ${e.degree ? `<span>${esc(e.degree)}</span>` : ''}
                                    ${e.from ? `<span class="mono">${esc(e.from)} – ${esc(e.to)}</span>` : ''}
                                </div>`).join('')}
                        </section>` : ''}

                        ${r.spoken?.length ? `
                        <section>
                            <h2>${t('cv.spoken')}</h2>
                            ${r.spoken.map(l => `<div class="side-item"><b>${esc(l.name)}</b><span>${esc(l.level)}</span></div>`).join('')}
                        </section>` : ''}
                    </aside>
                </div>

                <div class="cv-wide">
                    <section>
                        <h2>${t('cv.projects')}</h2>
                        <ul class="works">
                            ${r.projects.filter(p => p.featured).map(p => `
                                <li class="work">
                                    <div class="work-head">
                                        ${p.url ? `<a href="${esc(p.url)}"${ext(p.url)}><strong>${esc(p.name)}</strong></a>` : `<strong>${esc(p.name)}</strong>`}
                                        <span>${esc(p.industry)}${p.client ? ' · ' + esc(p.client) : ''}</span>
                                    </div>
                                    ${p.role ? `<div class="work-role">${esc(p.role)}</div>` : ''}
                                    <p>${esc(p.summary)}</p>
                                    <div class="tech">${(p.tech || []).map(esc).join(' · ')}</div>
                                </li>`).join('')}
                        </ul>
                        <p class="more"><b>${t('cv.others')}:</b> ${r.projects.filter(p => !p.featured).map(p => `${esc(p.name)} <span>(${esc(p.industry.toLowerCase())})</span>`).join(', ')}.</p>
                    </section>

                    <section>
                        <h2>${t('cv.products')}</h2>
                        <div class="products">
                            ${r.products.map(p => `
                                <${p.url ? `a href="${esc(p.url)}"${ext(p.url)}` : 'div'} class="product">
                                    <strong>${esc(p.name)}</strong><span class="badge">${esc(p.kind)}</span>
                                    <p>${esc(p.tagline)}${p.url ? '. ' + esc(p.url.replace(/^https?:\/\/|\/$/g, '')) : ''}</p>
                                </${p.url ? 'a' : 'div'}>`).join('')}
                        </div>
                    </section>
                </div>`;
            $('cv').removeAttribute('aria-busy');
            $('foot').innerHTML = siteFooter(r);
            // ?print=1 (the portfolio's "Download CV" button) opens the print dialog once fonts are ready
            if (new URLSearchParams(location.search).has('print')) document.fonts.ready.then(() => setTimeout(() => window.print(), 300));
        }).catch(e => {
            console.error(e);
            $('cv').innerHTML = `<p style="padding:32px;text-align:center;color:var(--muted)">${t('loadError')}</p>`;
        });
    </script>
</body>
</html>
