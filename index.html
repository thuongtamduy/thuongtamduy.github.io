<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trần Tiến Đạt | thuongtamduy.com</title>
    <meta name="description" content="Danh thiếp số của Trần Tiến Đạt: liên hệ và thông tin thanh toán.">
    <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">

    <link rel="icon" type="image/jpeg" href="avatar.jpg">
    <link rel="apple-touch-icon" href="avatar.jpg">

    <meta property="og:type" content="profile">
    <meta property="og:url" content="https://thuongtamduy.com/">
    <meta property="og:title" content="Trần Tiến Đạt | thuongtamduy.com">
    <meta property="og:description" content="Liên hệ và thông tin thanh toán của Trần Tiến Đạt.">
    <meta property="og:image" content="https://thuongtamduy.com/avatar.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0b0f17;
            --glow: rgba(56, 189, 248, 0.14);
            --surface: #131925;
            --surface-2: #1a2130;
            --border: rgba(255, 255, 255, 0.07);
            --text: #eef2f7;
            --muted: #8b95a7;
            --accent: #38bdf8;
            --accent-ink: #04121c;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.25);
            --radius: 18px;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f5f6f8;
                --glow: rgba(14, 165, 233, 0.12);
                --surface: #ffffff;
                --surface-2: #eef1f5;
                --border: rgba(15, 23, 42, 0.08);
                --text: #0f172a;
                --muted: #5b6577;
                --accent: #0284c7;
                --accent-ink: #ffffff;
                --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 8px 24px rgba(15, 23, 42, 0.06);
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background:
                radial-gradient(600px 360px at 50% -80px, var(--glow), transparent 70%),
                var(--bg);
            color: var(--text);
            font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 15px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }
        button { font: inherit; color: inherit; }
        svg { display: block; flex-shrink: 0; }

        .page {
            max-width: 440px;
            margin: 0 auto;
            padding: max(40px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
        }

        /* ---------- Hero ---------- */
        .hero { text-align: center; }
        .avatar {
            display: inline-block;
            width: 116px; height: 116px;
            border-radius: 50%;
            object-fit: cover;
            padding: 4px;
            background: conic-gradient(from 200deg, var(--accent), #a78bfa, #f472b6, var(--accent));
            box-shadow: var(--shadow);
        }
        .avatar-inner {
            display: block; width: 100%; height: 100%;
            border-radius: 50%; object-fit: cover;
            border: 3px solid var(--bg);
        }
        h1 {
            margin: 18px 0 4px;
            font-size: 24px; font-weight: 700;
            letter-spacing: -0.01em;
        }
        .slogan { margin: 0; color: var(--muted); font-style: italic; }

        /* ---------- Quick actions ---------- */
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1.4fr;
            gap: 10px;
            margin: 26px 0 28px;
        }
        .action {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            height: 48px; padding: 0 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-weight: 600; font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform .15s ease, background .15s ease;
        }
        .action:hover { background: var(--surface-2); }
        .action:active { transform: scale(0.97); }
        .action.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
        .action.primary:hover { filter: brightness(1.07); }

        /* ---------- CV / Portfolio links ---------- */
        .pages { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: -14px 0 24px; }
        .page-link {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: var(--shadow);
            text-decoration: none; color: var(--text);
            transition: background .15s, transform .15s;
        }
        .page-link:hover { background: var(--surface-2); }
        .page-link:active { transform: scale(0.98); }
        .page-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .page-link .tile { width: 36px; height: 36px; border-radius: 10px; }
        .page-link b { display: block; font-size: 14px; font-weight: 600; }
        .page-link small { display: block; font-size: 12px; color: var(--muted); }

        /* ---------- Tabs ---------- */
        .tabs {
            position: relative;
            display: grid; grid-template-columns: 1fr 1fr;
            padding: 4px;
            border-radius: 14px;
            background: var(--surface-2);
            margin-bottom: 14px;
        }
        .tab-indicator {
            position: absolute; top: 4px; bottom: 4px; left: 4px;
            width: calc(50% - 4px);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            transition: transform .25s cubic-bezier(.4, 0, .2, 1);
        }
        .tabs[data-active="payments"] .tab-indicator { transform: translateX(100%); }
        .tab {
            position: relative; z-index: 1;
            border: 0; background: none;
            height: 40px;
            font-weight: 600; font-size: 14px;
            color: var(--muted);
            cursor: pointer;
            transition: color .2s;
        }
        .tab[aria-selected="true"] { color: var(--text); }

        /* ---------- List ---------- */
        .panel[hidden] { display: none; }
        .list {
            margin: 0; padding: 0; list-style: none;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .list li + li { border-top: 1px solid var(--border); }
        .row {
            display: flex; align-items: center; gap: 14px;
            width: 100%;
            padding: 12px 14px;
            border: 0; background: none;
            text-align: left;
            color: inherit; text-decoration: none;
            cursor: pointer;
            transition: background .15s;
        }
        .row:hover { background: var(--surface-2); }
        .row:focus-visible, .action:focus-visible, .tab:focus-visible, .btn:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 2px;
        }
        .tile {
            width: 42px; height: 42px;
            border-radius: 12px;
            display: grid; place-items: center;
            color: var(--c, var(--text));
            background: color-mix(in srgb, var(--c, var(--text)) 14%, transparent);
            flex-shrink: 0;
        }
        .row-text { flex: 1; min-width: 0; }
        .row-title { display: block; font-weight: 600; }
        .row-sub {
            display: block;
            color: var(--muted); font-size: 13px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .row-end { color: var(--muted); opacity: .7; }

        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        footer {
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            margin-top: 28px;
            font-size: 12px;
            color: var(--muted);
        }
        .share {
            display: inline-flex; align-items: center; gap: 8px;
            height: 42px; padding: 0 18px;
            border: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
            border-radius: 999px;
            background: color-mix(in srgb, var(--accent) 8%, transparent);
            color: var(--accent);
            font-weight: 600; font-size: 14px;
            cursor: pointer;
            transition: background .15s, transform .15s;
        }
        .share:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); }
        .share:active { transform: scale(0.97); }
        .share:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* ---------- QR dialog ---------- */
        dialog {
            width: min(360px, calc(100vw - 32px));
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
        }
        dialog::backdrop { background: rgba(5, 8, 14, 0.6); backdrop-filter: blur(6px); }
        dialog[open] { animation: pop .22s cubic-bezier(.2, .9, .3, 1.2); }
        .dlg-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 16px 0 20px;
        }
        .dlg-head h2 { margin: 0; font-size: 17px; }
        .icon-btn {
            width: 36px; height: 36px;
            display: grid; place-items: center;
            border: 0; border-radius: 50%;
            background: var(--surface-2);
            cursor: pointer;
        }
        .dlg-body { padding: 16px 20px 20px; }
        .qr {
            display: block; width: 100%; aspect-ratio: 1 / 1.1;
            object-fit: contain;
            border-radius: 16px;
            background: #fff;
        }
        .acct {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            margin-top: 14px; padding: 12px 14px;
            border-radius: 14px;
            background: var(--surface-2);
        }
        .acct small { display: block; color: var(--muted); font-size: 12px; }
        .acct strong { font-size: 18px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            height: 38px; padding: 0 14px;
            border: 0; border-radius: 10px;
            background: var(--accent); color: var(--accent-ink);
            font-weight: 600; font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }
        .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .dlg-foot { display: flex; justify-content: center; margin-top: 12px; }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
            transform: translate(-50%, 20px);
            padding: 10px 16px;
            border-radius: 999px;
            background: var(--text); color: var(--bg);
            font-size: 14px; font-weight: 500;
            opacity: 0; pointer-events: none;
            transition: opacity .2s, transform .2s;
            z-index: 10;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* ---------- Motion ---------- */
        .reveal { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
        .reveal:nth-child(2) { animation-delay: .06s; }
        .reveal:nth-child(3) { animation-delay: .12s; }
        .reveal:nth-child(4) { animation-delay: .18s; }
        .reveal:nth-child(5) { animation-delay: .24s; }
        @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
        @keyframes pop { from { opacity: 0; transform: scale(.94); } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="page" id="app"></main>

    <dialog id="qr-dialog" aria-labelledby="qr-title">
        <div class="dlg-head">
            <h2 id="qr-title"></h2>
            <button class="icon-btn" type="button" data-close aria-label="Đóng"></button>
        </div>
        <div class="dlg-body">
            <img class="qr" id="qr-img" alt="">
            <div class="acct">
                <div>
                    <small>Số tài khoản</small>
                    <strong id="qr-acct"></strong>
                </div>
                <button class="btn" type="button" id="qr-copy"></button>
            </div>
            <div class="dlg-foot">
                <a class="btn ghost" id="qr-open" target="_blank" rel="noopener"></a>
            </div>
        </div>
    </dialog>

    <div class="toast" id="toast" role="status"></div>

        const UI = {

        const COLOR = { zalo: '#0068ff', messenger: '#0a7cff', globe: '#38bdf8', phone: '#22c55e', mail: '#f59e0b', bank: '#8b5cf6', wallet: '#d6336c', tool: '#14b8a6', file: '#38bdf8', grid: '#a78bfa' };

        function icon(name, size = 20) {

        function tile(name) {

        /* One list row: a link, or a button when `data` attrs are given */
        function row({ icon: ic, title, sub, href, attrs }) {

            return `<li>${href ? `<a class="row" href="${esc(href)}"${ext}>${inner}</a>` : `<button class="row" type="button" ${attrs}>${inner}</button>`}</li>`;

        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

        /* Toast */
        const toastEl = $('toast');
        let toastTimer;
        function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
        }
        async function copy(text) {
            try {
                await navigator.clipboard.writeText(text);
            } catch {
                const ta = Object.assign(document.createElement('textarea'), { value: text });
                document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
            }
            toast('Đã chép ' + text);
        }

        /* vCard */
        function saveContact(data) {
            const find = prefix => (data.contacts.find(c => c.url?.startsWith(prefix))?.url || '').slice(prefix.length);
            const web = data.contacts.find(c => c.icon === 'globe')?.url;
            const [d, m, y] = (data.profile.dob || '').split('/');
            const name = data.profile.name;
            const lines = [
                'BEGIN:VCARD', 'VERSION:3.0',
                `FN:${name}`,
                `N:${name.split(' ').slice(-1)[0]};${name.split(' ').slice(0, -1).join(' ')};;;`,
                find('tel:') && `TEL;TYPE=CELL:${find('tel:')}`,
                ...data.contacts.filter(c => c.url?.startsWith('mailto:')).map(c => `EMAIL;TYPE=INTERNET:${c.url.slice(7)}`),
                web && `URL:${web}`,
                'URL:https://thuongtamduy.com',
                y && `BDAY:${y}-${m}-${d}`,
                'END:VCARD'
            ].filter(Boolean);
            const blob = new Blob([lines.join('\r\n')], { type: 'text/vcard;charset=utf-8' });
            const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'tran-tien-dat.vcf' });
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }

        /* QR dialog */
        const dlg = $('qr-dialog');
        const closeBtn = dlg.querySelector('[data-close]');
        closeBtn.innerHTML = icon('x', 18);
        closeBtn.addEventListener('click', () => dlg.close());
        $('qr-copy').innerHTML = icon('copy', 16) + 'Chép';
        $('qr-copy').addEventListener('click', () => copy($('qr-acct').textContent));
        $('qr-open').innerHTML = icon('download', 16) + 'Mở ảnh QR';
        dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
        function openQR(p) {
            $('qr-title').textContent = p.name;
            Object.assign($('qr-img'), { src: p.qr, alt: 'Mã QR chuyển khoản ' + p.name });
            $('qr-acct').textContent = p.account;
            $('qr-open').href = p.qr;
            dlg.showModal();
        }

        /* Render */
        async function render() {
            const app = $('app');
            let data;
            try {
                data = await (await fetch('data.json', { cache: 'no-cache' })).json();
            } catch (e) {
                app.innerHTML = '<p style="text-align:center;color:var(--muted)">Không tải được dữ liệu.</p>';
                console.error(e);
                return;
            }
            const { profile, contacts, payments } = data;
            const tel = contacts.find(c => c.url?.startsWith('tel:'));
            const zalo = contacts.find(c => c.icon === 'zalo');

            app.innerHTML = `
                <header class="hero reveal">
                    <div class="avatar"><img class="avatar-inner" src="${esc(profile.avatar)}" alt="${esc(profile.name)}" width="108" height="108"></div>
                    <h1>${esc(profile.name)}</h1>
                    <p class="slogan">${esc(profile.slogan)}</p>
                </header>

                <nav class="actions reveal" aria-label="Liên hệ nhanh">
                    ${tel ? `<a class="action" href="${esc(tel.url)}">${icon('phone', 18)}Gọi</a>` : ''}
                    ${zalo ? `<a class="action" href="${esc(zalo.url)}" target="_blank" rel="noopener"><span aria-hidden="true">${icon('zalo', 40)}</span><span class="sr-only">Zalo</span></a>` : ''}
                    <button class="action primary" type="button" id="save-contact">${icon('userPlus', 18)}Lưu danh bạ</button>
                </nav>

                <nav class="pages reveal" aria-label="Hồ sơ">
                    <a class="page-link" href="cv.html">${tile('file')}<span><b>CV</b><small>Hồ sơ năng lực</small></span></a>
                    <a class="page-link" href="portfolio.html">${tile('grid')}<span><b>Portfolio</b><small>Dự án đã làm</small></span></a>
                </nav>

                <section class="reveal">
                    <div class="tabs" role="tablist" data-active="contacts">
                        <span class="tab-indicator" aria-hidden="true"></span>
                        <button class="tab" role="tab" id="t-contacts" aria-controls="p-contacts" aria-selected="true" data-tab="contacts">Liên hệ</button>
                        <button class="tab" role="tab" id="t-payments" aria-controls="p-payments" aria-selected="false" data-tab="payments" tabindex="-1">Thanh toán</button>
                    </div>

                    <div class="panel" id="p-contacts" role="tabpanel" aria-labelledby="t-contacts">
                        <ul class="list">
                            ${contacts.map(c => row({ icon: c.icon, title: c.label, sub: c.value, href: c.url })).join('')}
                        </ul>
                    </div>

                    <div class="panel" id="p-payments" role="tabpanel" aria-labelledby="t-payments" hidden>
                        <ul class="list">
                            ${payments.map((p, i) => p.qr
                                ? row({ icon: p.icon || 'bank', title: p.name, sub: p.account, attrs: `data-pay="${i}"` })
                                : row({ icon: p.icon || 'wallet', title: p.name, sub: p.value, href: p.url })).join('')}
                        </ul>
                    </div>
                </section>

                <footer class="reveal">
                    <button class="share" type="button" id="share">${icon('share', 17)}Chia sẻ danh thiếp</button>
                    <span>© ${new Date().getFullYear()} ${esc(profile.name)}</span>
                </footer>
            `;

            $('save-contact').addEventListener('click', () => saveContact(data));
            $('share').addEventListener('click', async () => {
                const url = location.origin + location.pathname;
                if (navigator.share) {
                    try { await navigator.share({ title: profile.name, text: 'Danh thiếp của ' + profile.name, url }); } catch {}
                } else copy(url);
            });

            const tablist = app.querySelector('.tabs');
            const tabs = [...tablist.querySelectorAll('.tab')];
            function select(tab) {
                tabs.forEach(t => {
                    const on = t === tab;
                    t.setAttribute('aria-selected', on);
                    t.tabIndex = on ? 0 : -1;
                    $(t.getAttribute('aria-controls')).hidden = !on;
                });
                tablist.dataset.active = tab.dataset.tab;
            }
            tabs.forEach(t => t.addEventListener('click', () => select(t)));
            tablist.addEventListener('keydown', e => {
                if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
                const next = tabs[(tabs.indexOf(document.activeElement) + 1) % tabs.length];
                select(next); next.focus();
            });

            app.querySelectorAll('[data-pay]').forEach(b =>
                b.addEventListener('click', () => openQR(payments[b.dataset.pay])));
        }

        render();
    </script>
</body>
</html>
