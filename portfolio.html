<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Portfolio · Trần Tiến Đạt</title>
    <meta name="description" content="Portfolio của Trần Tiến Đạt, Tech Lead backend: hệ thống thương mại điện tử đa nền tảng, SaaS multi-tenant và các dự án đã thực hiện.">
    <link rel="icon" type="image/jpeg" href="avatar.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://thuongtamduy.com/portfolio.html">
    <meta property="og:title" content="Portfolio · Trần Tiến Đạt, Tech Lead · Backend">
    <meta property="og:description" content="Thương mại điện tử đa nền tảng, SaaS multi-tenant, hạ tầng chịu tải và các dự án đã thực hiện.">
    <meta property="og:image" content="https://thuongtamduy.com/assets/projects/novadreams.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css">
    <link rel="alternate" hreflang="vi" href="https://thuongtamduy.com/portfolio.html">
    <link rel="alternate" hreflang="en" href="https://thuongtamduy.com/portfolio.html?lang=en">

    <style>
        .container { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
        .panel { background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }

        /* ---------- Section heads: numbered like drawing sheets ---------- */
        .block { padding-top: 88px; }
        .sec { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; align-items: end; margin-bottom: 30px; }
        .sec-no {
            grid-row: span 2;
            font-family: var(--mono); font-size: 13px; font-weight: 600;
            color: var(--accent);
            padding: 6px 8px; border: 1px solid var(--accent); border-radius: 4px;
            align-self: start; margin-top: 4px;
        }
        .sec h2 { margin: 0; font-size: clamp(24px, 3.4vw, 32px); font-weight: 700; }
        .sec .eyebrow { color: var(--muted); }
        .sec p { grid-column: 2; margin: 6px 0 0; max-width: 620px; color: var(--muted); }

        /* ---------- Hero ---------- */
        .hero { display: grid; grid-template-columns: 1fr 1.05fr; gap: 48px; align-items: center; padding-top: 56px; }
        .hero-tag { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }
        .hero-tag b { color: var(--accent); font-weight: 600; }
        .hero h1 {
            margin: 18px 0 10px;
            font-family: var(--mono);
            font-size: clamp(38px, 5.6vw, 66px);
            font-weight: 700;
            line-height: 1.02;
            letter-spacing: -0.045em;
        }
        .hero h1 span { color: var(--accent); }
        .hero .sub { margin: 0 0 22px; font-size: 19px; font-weight: 600; }
        .hero .lead { margin: 0 0 22px; color: var(--muted); max-width: 540px; }
        .principle {
            position: relative;
            margin: 0 0 28px; padding: 14px 16px 14px 44px;
            border: 1px dashed var(--border); border-radius: var(--radius);
            font-size: 15px;
        }
        .principle::before { content: '"'; position: absolute; left: 14px; top: 6px; font-family: var(--mono); font-size: 30px; color: var(--accent); }
        .cta { display: flex; flex-wrap: wrap; gap: 10px; }

        /* Hero figure */
        .figure { margin: 0; padding: 18px 18px 14px; }
        .figure svg { width: 100%; height: auto; overflow: visible; }
        .figure figcaption { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
        .fx-box { fill: var(--surface-2); stroke: var(--border); }
        .fx-core { fill: var(--accent-soft); stroke: var(--accent); }
        .fx-label { fill: var(--text); font-family: var(--mono); font-size: 13px; font-weight: 600; }
        .fx-small { fill: var(--muted); font-family: var(--mono); font-size: 10.5px; }
        .fx-line { fill: none; stroke: var(--border); stroke-width: 1.2; }
        .fx-flow { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 3 11; animation: flow 1.6s linear infinite; }
        .fx-flow.down { animation-duration: 2.1s; }
        .fx-db { fill: var(--surface-2); stroke: var(--accent); }
        .fx-dim { stroke: var(--muted); stroke-width: 1; fill: none; }
        @keyframes flow { to { stroke-dashoffset: -28; } }

        /* ---------- Spec sheet ---------- */
        .spec { display: grid; grid-template-columns: repeat(4, 1fr); margin: 56px 0 0; }
        .spec > div { padding: 18px 22px; }
        .spec > div + div { border-left: 1px solid var(--border); }
        .spec dt { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
        .spec dd { margin: 6px 0 0; font-family: var(--mono); font-size: 30px; font-weight: 700; letter-spacing: -0.03em; }

        /* ---------- Capabilities ---------- */
        .caps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .cap.hl { border-color: var(--accent); }
        .cap { padding: 22px 20px 24px; }
        .cap-ico { color: var(--accent); margin-bottom: 18px; }
        .cap h3 { margin: 0 0 8px; font-size: 17px; }
        .cap p { margin: 0; color: var(--muted); font-size: 14px; }

        /* ---------- Products ---------- */
        .labs { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; margin-bottom: 16px; }
        .lab { display: flex; flex-direction: column; overflow: hidden; }
        .lab-visual { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 26px 22px; border-bottom: 1px solid var(--border); }
        .lab-text { padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 10px; }
        .kind { font-family: var(--mono); font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
        .lab-text h3, .feature-text h3 { margin: 0; font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
        .lab-text p, .feature-text p { margin: 0; color: var(--muted); }
        .lab-text p strong, .feature-text p strong { color: var(--text); }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chips .chip { font-family: var(--mono); font-size: 12px; font-weight: 400; }

        .node { border: 1px solid var(--border); border-radius: 4px; background-color: var(--surface); }
        .ops { display: flex; align-items: center; gap: 12px; width: max-content; max-width: 100%; margin: 0 auto; padding: 10px 16px; border-color: var(--accent); }
        .ops svg { color: var(--accent); }
        .ops b { display: block; font-size: 14px; }
        .ops small { display: block; font-size: 12px; color: var(--muted); }
        .tenants { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; padding-top: 18px; }
        .tenants::before { content: ''; position: absolute; top: 0; left: 16.66%; right: 16.66%; height: 1px; background: var(--accent); opacity: .6; }
        .tenants::after { content: ''; position: absolute; top: -18px; left: 50%; width: 1px; height: 18px; background: var(--accent); opacity: .6; }
        .tenant { position: relative; display: flex; flex-direction: column; align-items: center; padding: 12px; text-align: center; }
        .tenant::before { content: ''; position: absolute; top: -19px; left: 50%; width: 1px; height: 18px; background: var(--accent); opacity: .6; }
        .tenant b { font-size: 13px; }
        .tenant .runtime { margin: 8px 0 6px; padding: 2px 8px; border-radius: 4px; font-family: var(--mono); font-size: 11px; color: var(--accent); background: var(--accent-soft); }
        .mods { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-bottom: 10px; }
        .mods span { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 3px; background: var(--surface-2); color: var(--muted); }
        .dbx { align-self: stretch; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--border); font-family: var(--mono); font-size: 11px; color: var(--muted); }
        .dia-note { margin: 14px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
        .stackline { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; font-family: var(--mono); font-size: 11.5px; }
        .stackline span { padding: 2px 8px; border-radius: 3px; background: var(--surface); border: 1px solid var(--border); }
        .stackline i { font-style: normal; color: var(--muted); }
        .stackline .no { margin-left: 6px; text-decoration: line-through; color: var(--muted); }
        .layers { display: flex; flex-direction: column; gap: 8px; }
        .layer { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 14px; font-size: 14px; font-weight: 600; }
        .layer small { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); text-align: right; }
        .layer.app { border-style: dashed; background-color: transparent; color: var(--muted); }
        .layer.core { color: var(--accent-ink); background-color: var(--accent); border-color: var(--accent); }
        .layer.core small { color: inherit; opacity: .8; }
        .layer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 10px; }
        .layers > .layer:last-child { margin: 0 20px; }

        .feature { display: grid; grid-template-columns: 1fr 1.25fr; overflow: hidden; text-decoration: none; }
        .feature-text { padding: 32px 30px; display: flex; flex-direction: column; gap: 14px; }
        .feature-text .go { margin-top: auto; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--accent); }
        .feature-shot { padding: 26px 0 0 26px; border-left: 1px solid var(--border); display: flex; align-items: flex-end; background-color: var(--surface-2); }
        .feature-shot img { display: block; width: 100%; height: auto; border: 1px solid var(--border); border-bottom: 0; border-right: 0; border-radius: 4px 0 0 0; transition: transform .4s; }
        .feature:hover .feature-shot img { transform: translate(-4px, -4px); }

        /* ---------- Projects ---------- */
        .works { display: flex; flex-direction: column; gap: 64px; list-style: none; margin: 0; padding: 0; }
        .work { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; }
        .work:nth-child(even) .shot { order: 2; }
        .shot { display: block; text-decoration: none; }
        .shot figure { margin: 0; padding: 10px; }
        .shot img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border: 1px solid var(--border); border-radius: 2px; transition: transform .3s; }
        .shot:hover img { transform: scale(1.01); }
        .shot figcaption { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
        .work-text .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
        .work-text h3 { margin: 8px 0 4px; font-family: var(--mono); font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
        .work-text .client { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
        .work-text .role { margin: 0 0 12px; font-size: 14px; }
        .work-text .role b { color: var(--accent); }
        .work-text .sum { margin: 0 0 16px; font-size: 15.5px; }
        .visit { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; font-family: var(--mono); font-size: 13px; color: var(--accent); text-decoration: none; }

        .others { margin-top: 72px; }
        .others h3 { margin: 0 0 12px; font-size: 18px; }
        .tr { display: grid; grid-template-columns: 1fr 1.3fr auto; gap: 16px; align-items: center; padding: 14px 20px; text-decoration: none; }
        .tr + .tr { border-top: 1px solid var(--border); }
        .tr.th { padding-block: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; background-color: var(--surface-2); }
        .tr b { font-weight: 600; }
        .tr span { color: var(--muted); font-size: 14px; }
        .tr .dom { font-family: var(--mono); font-size: 12px; }
        a.tr:hover { background-color: var(--surface-2); }
        a.tr:hover b { color: var(--accent); }

        /* ---------- Pipeline ---------- */
        .pipeline { padding: 22px 24px 26px; }
        .pipe-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-bottom: 16px; margin-bottom: 22px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
        .pipe-head .ok { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 4px; color: #16a34a; background: rgba(34, 197, 94, 0.12); }
        .jobs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; list-style: none; margin: 0; padding: 0; }
        .job { position: relative; padding-right: 22px; }
        .job-node { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px; }
        .job-node i {
            flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
            display: grid; place-items: center;
            color: #16a34a; background-color: var(--surface); border: 1.5px solid #22c55e;
            position: relative; z-index: 1;
        }
        .job::after { content: ''; position: absolute; top: 13px; left: 26px; right: 0; height: 1.5px; background: #22c55e; opacity: .5; }
        .job:last-child::after { display: none; }
        .job-node code { position: relative; z-index: 1; padding-right: 8px; background-color: var(--surface); color: var(--muted); }
        .job h3 { margin: 14px 0 6px; font-size: 17px; }
        .job p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
        .ships { font-family: var(--mono); font-size: 12px; color: var(--muted); }
        .ships ul { margin: 6px 0 0; padding: 0; list-style: none; }
        .ships li::before { content: '→ '; color: var(--accent); }

        /* ---------- Journey ---------- */
        .journey { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; list-style: none; margin: 0; padding: 0; }
        .step { padding: 22px 22px 24px; }
        .step.now { border-color: var(--accent); }
        .step .when { font-family: var(--mono); font-size: 13px; color: var(--accent); }
        .step h3 { margin: 10px 0 4px; font-size: 16.5px; }
        .step p { margin: 0; font-size: 13.5px; color: var(--muted); }
        .step a { color: inherit; text-decoration: none; }
        .step a:hover { color: var(--accent); }

        /* ---------- Technical map: the system drawn as stacked layers ---------- */
        .tech-map { padding: 8px 0; }
        .layer-band { display: grid; grid-template-columns: 210px 1fr auto; gap: 20px; align-items: start; padding: 18px 24px; }
        .layer-band + .layer-band { border-top: 1px dashed var(--border); }
        .layer-band.top { background: var(--accent-soft); }
        .band-name { display: flex; gap: 12px; align-items: baseline; }
        .band-name code { font-family: var(--mono); font-size: 12px; color: var(--accent); }
        .band-name b { font-size: 15px; }
        .band-groups { display: flex; flex-wrap: wrap; gap: 14px 22px; }
        .band-group small { display: block; margin-bottom: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
        .band-count { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; padding-top: 2px; }

        /* ---------- Education and languages ---------- */
        .bg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .bg-card { padding: 22px 24px; }
        .bg-card h3 { margin: 0 0 14px; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
        .bg-row + .bg-row { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
        .bg-row b { display: block; font-size: 16px; }
        .bg-row span { display: block; color: var(--muted); font-size: 14px; }

        /* ---------- Contact ---------- */
        .contact { margin: 96px 0 64px; padding: 48px 32px; text-align: center; }
        .contact h2 { margin: 0 0 10px; font-family: var(--mono); font-size: clamp(24px, 3.6vw, 34px); font-weight: 700; letter-spacing: -0.03em; }
        .contact p { margin: 0 auto 26px; max-width: 540px; color: var(--muted); }
        .contact .cta { justify-content: center; }

        @media (max-width: 920px) {
            .hero { grid-template-columns: 1fr; gap: 36px; padding-top: 36px; }
            .caps { grid-template-columns: 1fr 1fr; }
            .feature, .labs { grid-template-columns: 1fr; }
            .feature-shot { order: -1; border-left: 0; border-bottom: 1px solid var(--border); }
            .work { grid-template-columns: 1fr; gap: 18px; }
            .work:nth-child(even) .shot { order: 0; }
            .jobs { grid-template-columns: 1fr 1fr; row-gap: 28px; }
            .job:nth-child(2)::after { display: none; }
        }
        @media (max-width: 600px) {
            .block { padding-top: 64px; }
            .spec { grid-template-columns: 1fr 1fr; }
            .spec > div:nth-child(3) { border-left: 0; }
            .spec > div:nth-child(n+3) { border-top: 1px solid var(--border); }
            .caps, .journey, .bg-grid, .jobs { grid-template-columns: 1fr; }
            .layer-band { grid-template-columns: 1fr; gap: 10px; }
            .band-count { justify-self: start; }
            .job::after { display: none; }
            .tr { grid-template-columns: 1fr auto; }
            .tr .ind { grid-column: 1; grid-row: 2; margin-top: -10px; }
            .tr.th { display: none; }
            .work-text h3 { font-size: 23px; }
            .feature-text { padding: 24px 20px; }
            .contact { padding: 36px 20px; }
            .tenants { gap: 8px; }
            .tenant { padding: 10px 6px; }
            .lab-visual { padding: 22px 14px; }
            .sec { grid-template-columns: 1fr; }
            .sec-no { grid-row: auto; justify-self: start; }
            .sec p { grid-column: 1; }
        }
    </style>
</head>
<body>
    <a class="skip" href="#app" data-i18n="skip">Bỏ qua tới nội dung</a>
    <header class="nav">
        <div class="nav-inner">
            <a class="brand" href="./"><img src="avatar.jpg" alt=""><span>Trần Tiến Đạt</span></a>
            <nav class="nav-links" aria-label="Trang" data-i18n-aria="nav.aria">
                <a href="./" data-i18n="nav.card">Danh thiếp</a>
                <a href="cv.html" data-keep-lang>CV</a>
                <a href="portfolio.html" aria-current="page" data-keep-lang>Portfolio</a>
            </nav>
        </div>
    </header>

    <main class="container" id="app" tabindex="-1" aria-busy="true"></main>

    <footer class="site-foot" id="foot"></footer>

    <script src="assets/site.js"></script>
    <script>
        setupPage('portfolio');

        const pad = n => String(n).padStart(2, '0');
        const sec = (n, pre, withP = true) => `
            <header class="sec">
                <span class="sec-no">${pad(n)}</span>
                <span class="eyebrow">${t(pre + '.eyebrow')}</span>
                <h2>${t(pre + '.h2')}</h2>
                ${withP ? `<p>${t(pre + '.p')}</p>` : ''}
            </header>`;
        const chips = list => `<div class="chips">${list.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>`;

        /* Hero figure: channels -> one core -> a database per tenant */
        function heroFigure() {
            const ch = ['web', 'app', 'market', 'erp'].map(k => t('pf.ch.' + k));
            const cx = [70, 200, 330, 460];
            const tx = [130, 265, 400];
            return `
            <figure class="panel ticks figure" role="img" aria-label="${esc(t('pf.figAria'))}">
                <svg viewBox="0 0 530 400" aria-hidden="true">
                    ${cx.map((x, i) => `
                        <path class="fx-line" d="M${x} 52 C ${x} 110, 265 100, 265 150"/>
                        <path class="fx-flow" style="animation-delay:${-i * .4}s" d="M${x} 52 C ${x} 110, 265 100, 265 150"/>
                        <rect class="fx-box" x="${x - 56}" y="16" width="112" height="36" rx="4"/>
                        <text class="fx-label" x="${x}" y="39" text-anchor="middle">${esc(ch[i])}</text>`).join('')}

                    ${tx.map((x, i) => `
                        <path class="fx-line" d="M265 214 C 265 260, ${x} 250, ${x} 296"/>
                        <path class="fx-flow down" style="animation-delay:${-i * .5}s" d="M265 214 C 265 260, ${x} 250, ${x} 296"/>
                        <path class="fx-db" d="M${x - 40} 304 v40 a40 9 0 0 0 80 0 v-40"/>
                        <ellipse class="fx-db" cx="${x}" cy="304" rx="40" ry="9"/>
                        <text class="fx-small" x="${x}" y="334" text-anchor="middle">db_${'abc'[i]}</text>`).join('')}

                    <rect class="fx-core" x="160" y="150" width="210" height="64" rx="4"/>
                    <text class="fx-label" x="265" y="179" text-anchor="middle" style="font-size:15px">backend core</text>
                    <text class="fx-small" x="265" y="199" text-anchor="middle">${esc(t('pf.core.sub'))}</text>

                    <path class="fx-dim" d="M60 378 H470 M60 372 v12 M470 372 v12"/>
                    <text class="fx-small" x="265" y="396" text-anchor="middle">${esc(t('pf.tenants'))}</text>
                </svg>
                <figcaption>${esc(t('pf.fig'))}</figcaption>
            </figure>`;
        }

        /* Diagrams for products without a screenshot */
        const VISUALS = {
            tenants: () => `
                <div class="node ops">${icon('sliders', 20)}<div><b>XForce Ops</b><small>${t('pf.dia.ops')}</small></div></div>
                <div class="tenants">
                    ${[['Tenant A', ['orders', 'inventory']], ['Tenant B', ['orders', 'crm']], ['Tenant C', ['inventory', 'crm', 'hr']]].map(([name, mods], i) => `
                        <div class="node tenant">
                            <b>${name}</b>
                            <span class="runtime">Denolith</span>
                            <div class="mods">${mods.map(m => `<span>${m}</span>`).join('')}</div>
                            <div class="dbx">${icon('db', 14)}db_${'abc'[i]}</div>
                        </div>`).join('')}
                </div>
                <p class="dia-note">${t('pf.dia.note')}</p>
                <div class="stackline">${['Deno', 'Hono', 'Kysely'].map(x => `<span>${x}</span>`).join('<i>+</i>')}<span class="no">node_modules</span></div>`,
            stack: () => `
                <div class="layers">
                    <div class="node layer app">${t('pf.dia.app')}<small>${t('pf.dia.appSmall')}</small></div>
                    <div class="node layer core">Denolith<small>${t('pf.dia.core')}</small></div>
                    <div class="layer-row">
                        <div class="node layer">Hono<small>routing</small></div>
                        <div class="node layer">Prisma<small>ORM</small></div>
                    </div>
                    <div class="node layer">Deno<small>runtime · TypeScript</small></div>
                </div>`
        };
        const lab = p => `
            <article class="panel lab">
                <div class="lab-visual" aria-hidden="true">${VISUALS[p.visual]()}</div>
                <div class="lab-text">
                    <span class="kind">${esc(p.kind)}</span>
                    <h3>${esc(p.name)}</h3>
                    <p><strong>${esc(p.tagline)}.</strong> ${esc(p.text)}</p>
                    ${chips(p.tags)}
                </div>
            </article>`;

        const work = (p, i) => {
            const tag = p.url ? `a href="${esc(p.url)}"${ext(p.url)} aria-label="${esc(t('pf.open', p.domain))}"` : 'div';
            return `
            <li class="work">
                <${tag} class="shot">
                    <figure class="panel ticks">
                        <img src="${esc(p.image)}" alt="${esc(t('pf.homeAlt', p.name))}" loading="lazy" width="960" height="600">
                        <figcaption><span>${t('pf.figNo', pad(i + 2))}</span><span>${esc(p.domain)}</span></figcaption>
                    </figure>
                </${p.url ? 'a' : 'div'}>
                <div class="work-text">
                    <div class="meta">${pad(i + 1)} · ${esc(p.industry)}</div>
                    <h3>${esc(p.name)}</h3>
                    ${p.client ? `<p class="client">${t('pf.client')}: ${esc(p.client)}</p>` : ''}
                    ${p.role ? `<p class="role">${t('pf.role')}: <b>${esc(p.role)}</b></p>` : ''}
                    <p class="sum">${esc(p.summary)}</p>
                    ${chips(p.tech || [])}
                    ${p.url ? `<a class="visit" href="${esc(p.url)}"${ext(p.url)}>${esc(p.domain)} ${icon('arrow', 15)}</a>` : ''}
                </div>
            </li>`;
        };

        loadResume().then(r => {
            const featured = r.projects.filter(p => p.featured);
            const others = r.projects.filter(p => !p.featured);
            const exp = years(r.since);
            const email = r.contact.find(c => c.icon === 'mail');
            const phone = r.contact.find(c => c.icon === 'phone');
            const check = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
            let n = 0;

            $('app').innerHTML = `
                <section class="hero">
                    <div class="reveal">
                        <div class="hero-tag"><b>${esc(r.title)}</b><span>${t('years', exp)}</span></div>
                        <h1>${esc(r.name)}<span>.</span></h1>
                        <p class="sub">${t('pf.tag')}</p>
                        <p class="lead">${esc(r.summary)}</p>
                        ${r.principle ? `<p class="principle">${esc(r.principle)}</p>` : ''}
                        <div class="cta">
                            <a class="btn" href="#projects">${t('pf.viewProjects')} ${icon('right', 17)}</a>
                            <a class="btn ghost" href="${withLang('cv.html')}${LANG === 'en' ? '&' : '?'}print=1">${icon('printer', 16)}${t('pf.pdf')}</a>
                        </div>
                    </div>
                    <div class="reveal" style="--i:2">${heroFigure()}</div>
                </section>

                <dl class="panel spec reveal" style="--i:3" aria-label="${t('pf.spec')}">
                    <div><dt>${t('pf.stat.years')}</dt><dd>${exp}+</dd></div>
                    <div><dt>${t('pf.stat.companies')}</dt><dd>${r.experience.length}</dd></div>
                    <div><dt>${t('pf.stat.projects')}</dt><dd>${r.projects.length}</dd></div>
                    <div><dt>${t('pf.stat.products')}</dt><dd>${r.products.length}</dd></div>
                </dl>

                <section class="block" id="services">
                    ${sec(++n, 'pf.caps')}
                    <div class="caps">
                        ${r.capabilities.map(c => `
                            <article class="panel cap${c.icon === 'sparkles' ? ' hl' : ''}">
                                <div class="cap-ico">${icon(c.icon, 26)}</div>
                                <h3>${esc(c.title)}</h3>
                                <p>${esc(c.text)}</p>
                            </article>`).join('')}
                    </div>
                </section>

                <section class="block" id="products">
                    ${sec(++n, 'pf.prod', false)}
                    <div class="labs">${r.products.filter(p => p.visual).map(lab).join('')}</div>
                    ${r.products.filter(p => p.image).map(p => `
                    <a class="panel feature" href="${esc(p.url)}"${ext(p.url)}>
                        <div class="feature-text">
                            <span class="kind">${esc(p.kind)}</span>
                            <h3>${esc(p.name)}</h3>
                            <p><strong>${esc(p.tagline)}.</strong> ${esc(p.text)}</p>
                            ${chips(p.tags)}
                            <span class="go">${t('pf.try')} ${esc(p.url.replace(/^https?:\/\/|\/$/g, ''))} ${icon('arrow', 17)}</span>
                        </div>
                        <div class="feature-shot"><img src="${esc(p.image)}" alt="${esc(t('pf.shotAlt', p.name))}" loading="lazy" width="960" height="600"></div>
                    </a>`).join('')}
                </section>

                <section class="block" id="projects">
                    ${sec(++n, 'pf.proj')}
                    <ol class="works">${featured.map(work).join('')}</ol>
                    ${others.length ? `
                    <div class="others">
                        <h3>${t('pf.others')}</h3>
                        <div class="panel" role="table">
                            <div class="tr th" role="row"><span role="columnheader">${t('pf.th.project')}</span><span role="columnheader">${t('pf.th.industry')}</span><span role="columnheader">${t('pf.th.site')}</span></div>
                            ${others.map(p => `
                                <${p.url ? `a href="${esc(p.url)}"${ext(p.url)}` : 'div'} class="tr" role="row">
                                    <b role="cell">${esc(p.name)}</b>
                                    <span class="ind" role="cell">${esc(p.industry)}</span>
                                    <span class="dom" role="cell">${esc(p.domain)}</span>
                                </${p.url ? 'a' : 'div'}>`).join('')}
                        </div>
                    </div>` : ''}
                </section>

                ${r.process ? `
                <section class="block" id="process">
                    ${sec(++n, 'pf.proc')}
                    <div class="panel ticks pipeline">
                        <div class="pipe-head"><span>project.yml</span><span class="ok">${check} ${r.process.length}/${r.process.length} ${t('pf.passed')}</span></div>
                        <ol class="jobs">
                            ${r.process.map(s => `
                                <li class="job">
                                    <div class="job-node"><i>${check}</i><code>${esc(s.job || '')}</code></div>
                                    <h3>${esc(s.step)}</h3>
                                    <p>${esc(s.text)}</p>
                                    <div class="ships">${t('pf.outputs')}<ul>${s.outputs.map(o => `<li>${esc(o)}</li>`).join('')}</ul></div>
                                </li>`).join('')}
                        </ol>
                    </div>
                </section>` : ''}

                <section class="block">
                    ${sec(++n, 'pf.journey', false)}
                    <ol class="journey">
                        ${[...r.experience].reverse().map(e => `
                            <li class="panel step${e.current ? ' now' : ''}">
                                <span class="when">${esc(e.from)} – ${esc(e.to)}</span>
                                <h3>${e.url ? `<a href="${esc(e.url)}"${ext(e.url)}>${esc(e.company)}</a>` : esc(e.company)}</h3>
                                ${e.role ? `<p>${esc(e.role)}</p>` : ''}
                                ${e.group ? `<p>${esc(e.group)}</p>` : ''}
                            </li>`).join('')}
                    </ol>
                </section>

                <section class="block">
                    ${sec(++n, 'pf.stack')}
                    <div class="panel ticks tech-map">
                        ${(r.layers || []).map((l, i, all) => {
                            const groups = l.groups.map(k => r.skills.find(s => s.key === k)).filter(Boolean);
                            const count = new Set(groups.flatMap(g => g.items)).size;
                            return `
                            <div class="layer-band${i === 0 ? ' top' : ''}">
                                <div class="band-name"><code>L${all.length - i}</code><b>${esc(l.name)}</b></div>
                                <div class="band-groups">
                                    ${groups.map(g => `<div class="band-group"><small>${esc(g.group)}</small>${chips(g.items)}</div>`).join('')}
                                </div>
                                <span class="band-count">${t('pf.count', count)}</span>
                            </div>`;
                        }).join('')}
                    </div>
                </section>

                ${r.education?.length || r.spoken?.length ? `
                <section class="block">
                    ${sec(++n, 'pf.edu', false)}
                    <div class="bg-grid">
                        <div class="panel bg-card">
                            <h3>${t('cv.education')}</h3>
                            ${(r.education || []).map(e => `<div class="bg-row"><b>${esc(e.school)}</b>${e.degree ? `<span>${esc(e.degree)}</span>` : ''}${e.from ? `<span class="mono">${esc(e.from)} – ${esc(e.to)}</span>` : ''}</div>`).join('')}
                        </div>
                        <div class="panel bg-card">
                            <h3>${t('cv.spoken')}</h3>
                            ${(r.spoken || []).map(l => `<div class="bg-row"><b>${esc(l.name)}</b><span>${esc(l.level)}</span></div>`).join('')}
                        </div>
                    </div>
                </section>` : ''}

                <section class="panel ticks contact">
                    <h2>${t('pf.contact.h2')}</h2>
                    <p>${t('pf.contact.p')}</p>
                    <div class="cta">
                        ${email ? `<a class="btn" href="${esc(email.url)}">${icon('mail', 17)}${esc(email.value)}</a>` : ''}
                        ${phone ? `<a class="btn ghost" href="${esc(phone.url)}">${icon('phone', 17)}${esc(phone.value)}</a>` : ''}
                        <a class="btn ghost" href="./">${t('nav.card')}</a>
                    </div>
                </section>`;
            $('app').removeAttribute('aria-busy');
            $('foot').innerHTML = siteFooter(r);
        }).catch(e => {
            console.error(e);
            $('app').innerHTML = `<p style="padding:64px 0;text-align:center;color:var(--muted)">${t('loadError')}</p>`;
        });
    </script>
</body>
</html>
